[package]
name = "bt-image"
version = "1.0.0"
authors = ["Lifeng Yan"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/bt-lang/bt"
edition = "2021"
rust-version = "1.88"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bt-extension-sdk = { path = "../../crates/bt-extension-sdk" }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
font8x8 = "=0.3.1"

[workspace]

[lints.rust]
warnings = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true
