[[permission]]
identifier = "allow-window-control"
description = "Allow the BT frontend bridge to control the current desktop window."
commands.allow = [
  "window_set_title",
  "window_set_size",
  "window_set_position",
  "window_placement",
  "window_set_background_color",
  "window_set_fullscreen",
  "window_set_resizable",
  "window_minimize",
  "window_maximize",
  "window_restore",
  "window_close",
  "window_close_now",
  "window_hide",
  "window_show",
  "window_focus",
  "window_center",
  "window_is_fullscreen",
  "window_is_maximized",
  "window_is_minimized",
  "window_is_visible",
  "window_set_always_on_top",
  "window_is_always_on_top",
  "window_set_decorations",
  "window_set_skip_taskbar",
  "window_set_close_mode",
  "window_set_close_intercept",
  "window_drag",
  "window_start_resize",
  "window_flash",
  "window_open_devtools",
]
