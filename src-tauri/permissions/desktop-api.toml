[[permission]]
identifier = "allow-desktop-api"
description = "Allow the BT frontend bridge to call the first-generation desktop API."
commands.allow = [
  "dialog_open_file",
  "dialog_open_files",
  "dialog_open_dir",
  "dialog_save_file",
  "dialog_message",
  "dialog_confirm",
  "tray_enable",
  "tray_disable",
  "tray_set_icon",
  "tray_set_tooltip",
  "tray_set_menu",
  "clipboard_read_text",
  "clipboard_write_text",
  "clipboard_clear",
  "notify_permission_state",
  "notify_request_permission",
  "notify_show",
  "app_version",
  "app_info",
  "app_run",
  "app_engine_version",
  "app_platform",
  "app_open_url",
  "app_open_path",
  "app_reveal_path",
  "app_quit",
  "app_args",
  "app_documents_dir",
  "app_watch_path",
  "app_unwatch_path",
  "credential_store",
  "credential_has",
  "credential_delete",
  "http_stream_start",
  "http_stream_cancel",
  "workspace_open",
  "workspace_close",
  "workspace_list",
  "workspace_read",
  "workspace_atomic_write",
  "process_start",
  "process_status",
  "process_stop",
  "process_stop_task",
  "data_cleanup_prepare",
  "data_cleanup_confirm",
  "data_store",
  "data_load",
]
