name: Build BT Cross-Platform

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  notices:
    name: Generate third-party notices
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo-about
        id: cargo-about-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-about.exe
          key: windows-cargo-about-0.9.2

      - name: Install pinned cargo-about
        if: steps.cargo-about-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-about --version 0.9.2 --locked --features cli

      - name: Generate platform-specific notices
        shell: pwsh
        run: |
          $version = (& cargo about --version | Out-String).Trim()
          if ($version -notmatch '^cargo-about 0\.9\.2($|\s)') {
            throw "Expected cargo-about 0.9.2, found: $version"
          }

          $noticeRoot = 'target/release-notices'
          New-Item -ItemType Directory -Force $noticeRoot | Out-Null
          foreach ($profile in @('windows-x64', 'linux-x64', 'macos-arm64', 'macos-x64')) {
            tools/compliance/generate-third-party-licenses.ps1 `
              -ReleaseProfile $profile `
              -OutputPath (Join-Path $noticeRoot "$profile.txt")
          }

      - name: Upload third-party notices
        uses: actions/upload-artifact@v7
        with:
          name: third-party-notices
          path: target/release-notices/*.txt
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build bt and bt_app (${{ matrix.name }})
    needs: notices
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            platform: windows
            artifact_stem: bt-windows-x64
            expected_host: x86_64-pc-windows-msvc
            bt_path: target/release/bt.exe
            bt_app_path: target/release/bt_app.exe

          - name: linux-x64
            # xcap 0.9.8 pulls in pipewire-rs 0.10, whose generated SPA
            # bindings require PipeWire >= 0.3.65. Ubuntu 22.04 only ships
            # 0.3.48, while Ubuntu 24.04 ships 1.0.x.
            os: ubuntu-24.04
            platform: linux
            artifact_stem: bt-linux-x64
            expected_host: x86_64-unknown-linux-gnu
            bt_path: target/x86_64-unknown-linux-musl/release/bt
            bt_app_path: target/release/bt_app

          - name: macos-arm64
            os: macos-15
            platform: macos
            artifact_stem: bt-macos-arm64
            expected_host: aarch64-apple-darwin
            bt_path: target/release/bt
            bt_app_path: target/release/bt_app

          - name: macos-x64
            os: macos-15-intel
            platform: macos
            artifact_stem: bt-macos-x64
            expected_host: x86_64-apple-darwin
            bt_path: target/release/bt
            bt_app_path: target/release/bt_app

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Download third-party notices
        uses: actions/download-artifact@v8
        with:
          name: third-party-notices
          path: target/release-notices

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Determine release archive name
        id: package
        shell: pwsh
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $packages = @($metadata.packages | Where-Object { $_.name -eq 'bt' })
          if ($packages.Count -ne 1) {
            throw "Expected exactly one bt package in Cargo metadata, found $($packages.Count)"
          }

          $version = $packages[0].version
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$') {
            throw "Invalid bt package version: $version"
          }

          $archive = '${{ matrix.artifact_stem }}-' + $version + '.zip'
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "archive=$archive" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Cache Cargo downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/registry/src/
            ~/.cargo/git/db/
            ~/.cargo/git/checkouts/
          key: ${{ runner.os }}-cargo-download-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-download-

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          # Keep xcap's native backends explicit instead of relying on packages preinstalled on the hosted runner.
          sudo apt-get install -y \
            build-essential \
            musl-tools \
            pkg-config \
            libclang-dev \
            libdbus-1-dev \
            libdrm-dev \
            libegl-dev \
            libgbm-dev \
            libudev-dev \
            libwayland-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libpipewire-0.3-dev \
            libxcb1-dev \
            libxrandr-dev \
            patchelf \
            zip
          required_modules=(
            dbus-1
            egl
            gbm
            gtk+-3.0
            libdrm
            libpipewire-0.3
            libudev
            wayland-client
            wayland-server
            webkit2gtk-4.1
            xcb
            xrandr
          )
          missing_modules=()
          for module in "${required_modules[@]}"; do
            if ! pkg-config --exists "$module"; then
              missing_modules+=("$module")
            fi
          done
          if ((${#missing_modules[@]})); then
            echo "Missing Linux native development modules: ${missing_modules[*]}" >&2
            exit 1
          fi
          pipewire_version="$(pkg-config --modversion libpipewire-0.3)"
          if ! dpkg --compare-versions "$pipewire_version" ge "0.3.65"; then
            echo "PipeWire >= 0.3.65 is required by xcap 0.9.8; found $pipewire_version" >&2
            exit 1
          fi
          rustup target add x86_64-unknown-linux-musl

      - name: Verify native toolchain
        shell: pwsh
        run: |
          $hostLine = rustc -vV | Select-String '^host:'
          if ($hostLine -notmatch '^host: ${{ matrix.expected_host }}$') {
            throw "Expected ${{ matrix.expected_host }}, found: $hostLine"
          }

      - name: Build bt on Windows and macOS
        if: matrix.platform != 'linux'
        run: cargo build --locked --release --bin bt

      - name: Build static bt on Linux
        if: matrix.platform == 'linux'
        run: cargo build --locked --release --target x86_64-unknown-linux-musl --no-default-features --features extensions --bin bt

      - name: Build bt_app
        run: cargo build --locked --release --features desktop --bin bt_app

      - name: Stage programs, licenses, and notices
        shell: pwsh
        run: |
          $programs = @(
            '${{ matrix.bt_path }}'
            '${{ matrix.bt_app_path }}'
          )
          foreach ($program in $programs) {
            if (-not (Test-Path -LiteralPath $program -PathType Leaf)) {
              throw "Expected build output was not created: $program"
            }
          }

          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -LiteralPath $programs -Destination dist
          Copy-Item -LiteralPath README.md,README.zh-CN.md,LICENSE-APACHE,LICENSE-MIT,COPYRIGHT -Destination dist
          $notice = 'target/release-notices/${{ matrix.name }}.txt'
          if (-not (Test-Path -LiteralPath $notice -PathType Leaf)) {
            throw "Expected third-party notice was not generated: $notice"
          }
          Copy-Item -LiteralPath $notice -Destination dist/THIRD-PARTY-NOTICES.txt

      - name: Preserve Unix executable permissions
        if: matrix.platform != 'windows'
        shell: bash
        run: chmod +x dist/bt dist/bt_app

      - name: Package Windows artifact
        if: matrix.platform == 'windows'
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath '${{ steps.package.outputs.archive }}'

      - name: Package Unix artifact
        if: matrix.platform != 'windows'
        shell: bash
        run: zip -j '${{ steps.package.outputs.archive }}' dist/*

      - name: Verify archive contents
        shell: pwsh
        run: |
          $archive = '${{ steps.package.outputs.archive }}'
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) {
            throw "Expected release archive was not created: $archive"
          }

          $programs = if ('${{ matrix.platform }}' -eq 'windows') {
            @('bt.exe', 'bt_app.exe')
          } else {
            @('bt', 'bt_app')
          }
          $expected = @($programs + @('COPYRIGHT', 'LICENSE-APACHE', 'LICENSE-MIT', 'README.md', 'README.zh-CN.md', 'THIRD-PARTY-NOTICES.txt') | Sort-Object)

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path -LiteralPath $archive))
          try {
            $actual = @($zip.Entries | Where-Object { $_.Name } | ForEach-Object { $_.FullName } | Sort-Object)
          } finally {
            $zip.Dispose()
          }

          $difference = Compare-Object -ReferenceObject $expected -DifferenceObject $actual
          if ($difference) {
            $difference | Format-Table | Out-String | Write-Error
            throw "Unexpected files or directory prefixes in release archive: $archive"
          }

          $archivePlatform = if ('${{ matrix.platform }}' -eq 'windows') { 'windows' } else { 'unix' }
          tools/compliance/verify-release-archive.ps1 `
            -ArchivePath $archive `
            -Platform $archivePlatform `
            -ReleaseProfile '${{ matrix.name }}'

      - name: Upload ${{ steps.package.outputs.archive }}
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.package.outputs.archive }}
          archive: false
          if-no-files-found: error
          retention-days: 30
