<style
   id="cat-animation-css"><![CDATA[
  /* Blink by briefly squashing both eyes. */
  #layer4 {
    transform-box: fill-box;
    transform-origin: center center;
    animation: cat-blink 4.2s infinite;
  }
  #path5,
	#ellipse6 {
	  transform-box: fill-box;
	  transform-origin: center center;
	  animation: pupil-look 5.2s ease-in-out infinite;
	}
	@keyframes pupil-look {
	  0%, 18% {
		transform: translate(0, 0);
	  }

	  28%, 42% {
		transform: translate(2.2px, -0.4px);
	  }

	  52%, 64% {
		transform: translate(4.2px, 0.2px);
	  }

	  74%, 84% {
		transform: translate(1.2px, 0.5px);
	  }

	  100% {
		transform: translate(0, 0);
	  }
	}

  @keyframes cat-blink {
    0%, 88%, 92%, 100% { transform: scaleY(1); }
    90% { transform: scaleY(0.08); }
  }

  /* Let the tail sway gently around its base. */
  #path6 {
    transform-box: fill-box;
    transform-origin: 6% 70%;
    animation: tail-wag 1.25s ease-in-out infinite;
  }

  @keyframes tail-wag {
    0%, 100% { transform: rotate(-4deg); }
    50% { transform: rotate(5deg); }
  }
]]></style><g
