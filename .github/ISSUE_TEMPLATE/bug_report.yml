name: Bug report
description: Report a reproducible problem in BT.
title: "[Bug]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve BT. Do not include credentials, private data, or unpatched vulnerability details. Report security issues through the private link in SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the smallest BT program, configuration, or ordered steps that reproduce the problem.
      placeholder: |
        1. Run ...
        2. Configure ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the BT version or commit, operating system, architecture, target, and enabled Cargo features.
      placeholder: |
        BT version or commit:
        Operating system and architecture:
        Target (bt, bt_app, web, extension):
        Enabled features:
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Paste short logs or stack traces after removing credentials and personal data.
      render: shell
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any other details, screenshots, or workaround information.
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checklist
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: This report does not disclose an unpatched security vulnerability.
          required: true
